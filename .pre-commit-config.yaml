repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: eval
        name: harnesslab eval (manual)
        entry: uv run harnesslab eval
        language: system
        pass_filenames: false
        always_run: true
        # Manual stage only: run with `pre-commit run --hook-stage manual eval`.
        # Kept out of pre-commit to keep per-commit latency low while the
        # `pytest tests/test_eval_tasks.py` integration test still guards
        # baseline correctness on every commit.
        stages: [manual]
