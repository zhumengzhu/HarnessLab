[project]
name = "harnesslab"
version = "0.1.0"
description = "A learning-first agent harness project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.26.0",
  "pydantic>=2.7.0",
]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
