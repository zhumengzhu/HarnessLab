[project]
name = "harnesslab"
version = "0.1.0"
description = "A learning-first agent harness project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0",
  "anthropic>=0.104.1",
  "google-genai>=2.6.0",
  "httpx>=0.28.1",
  "json5>=0.14.0",
  "jsonschema>=4.26.0",
  "openai>=2.38.0",
  "opentelemetry-api>=1.42.1",
  "opentelemetry-exporter-otlp-proto-http>=1.42.1",
  "opentelemetry-sdk>=1.42.1",
  "pydantic>=2.7.0",
  "pypdfium2>=5.8.0",
  "pyyaml>=6.0.3",
  "textual>=1.0.0",
]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.hatch.build.targets.wheel.force-include]
"src/harnesslab/core/prompt/blocks" = "harnesslab/core/prompt/blocks"
"src/harnesslab/providers/catalog" = "harnesslab/providers/catalog"
"src/harnesslab/providers/pricing_catalog.json" = "harnesslab/providers/pricing_catalog.json"
"src/harnesslab/skills/samples" = "harnesslab/skills/samples"
"src/harnesslab/skills/sample-index.json" = "harnesslab/skills/sample-index.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests requiring live network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
